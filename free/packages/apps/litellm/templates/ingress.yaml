{{- if .Values.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "litellm.fullname" . }}
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ include "litellm.fullname" . }}-tls
{{- end }}
