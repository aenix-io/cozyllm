##
## @section Common parameters
##

## @param {string} [host] - Hostname for external access via Ingress. Leave empty to skip Ingress.
host: ""

## @param {string} [storageClass] - StorageClass for the persistent volume. Leave empty to use cluster default.
storageClass: ""

##
## @section Storage
##

## @typedef {struct} Storage - Persistent storage for ComfyUI models, outputs, and custom nodes.
## @field {quantity} size - PVC size. Stable Diffusion checkpoints range from 2GB (SD 1.5) to 12GB+ (SDXL/Flux); 50Gi fits ~4-6 models plus outputs.

## @param {Storage} storage - Storage configuration.
storage:
  size: 50Gi

##
## @section GPU
##

## @param {bool} gpuEnabled - Enable GPU acceleration. Set to false for CPU-only mode (very slow, for testing only).
gpuEnabled: true

## @param {int} gpuCount - Number of GPUs allocated to the pod.
gpuCount: 1

##
## @section Resources
##

## @typedef {struct} Resources - Container CPU/Memory request and limit overrides.
## @field {string} cpu - CPU request and limit.
## @field {string} memory - Memory request and limit.

## @param {Resources} resources - Resource overrides.
resources:
  cpu: "4"
  memory: "16Gi"

##
## @section Replication
##

## @param {int} replicaCount - Number of ComfyUI pods. Usually 1 — ComfyUI is stateful and multiple replicas do not share workflow state.
replicaCount: 1
