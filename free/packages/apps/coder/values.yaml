##
## @section Common parameters
##

## @param {string} host - Hostname the Coder UI is reached by. Required: Coder builds the URLs it hands to browsers and workspace agents from this, so it cannot be derived from a Service address.
host: ""

## @param {string} [wildcardHost] - Base domain for per-workspace application subdomains, without the leading wildcard. Leave empty to serve workspace apps on paths instead, which breaks any app that assumes it owns the document root.
wildcardHost: ""

## @param {string} [storageClass] - StorageClass for the database on the management cluster. Leave empty to use the cluster default.
storageClass: ""

##
## @section Database
##

## @typedef {struct} Database - Coder's database, holding workspace definitions, templates, users and the audit log. A private dependency provisioned on the management cluster, deliberately out of reach of the workspaces themselves.
## @field {quantity} size - Persistent Volume size.
## @field {int} replicas - Number of database instances.
## @field {string} [password] - Explicit password. When empty, one is generated and preserved across reconciles.
## @param {Database} database - Coder database.
database:
  size: 10Gi
  replicas: 2
  password: ""

