## @typedef {struct} Resources - Explicit CPU and memory. Leave empty to take the values from the preset.
## @field {quantity} [cpu] - CPU available to the pod.
## @field {quantity} [memory] - Memory available to the pod.
## @field {quantity} [ephemeral-storage] - Ephemeral storage for the pod.

## @param {ResourcesPreset} resourcesPreset - Sizing preset for the Coder server. The server brokers connections and provisions workspaces rather than running their workloads, so it stays small however large the workspaces are.
resourcesPreset: "t1.medium"

## @param {Resources} [resources] - Explicit resources, overriding the preset.
resources: {}

## @param {int} replicaCount - Number of Coder server replicas.
replicaCount: 2
