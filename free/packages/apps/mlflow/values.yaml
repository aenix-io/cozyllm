## @typedef {struct} Resources - Explicit CPU and memory for the tracking server. Leave empty to take the values from the preset; anything set here overrides it field by field.
## @field {quantity} [cpu] - CPU available to the server.
## @field {quantity} [memory] - Memory available to the server.
## @field {quantity} [ephemeral-storage] - Ephemeral storage for the server.
## @param {Resources} [resources] - Explicit resources, overriding the preset.
resources: {}

## @param {ResourcesPreset} resourcesPreset - Default sizing preset. The tracking server records runs rather than executing them, so it stays small no matter how large the training jobs writing to it are.
resourcesPreset: "t1.medium"

## @param {int} replicaCount - Number of tracking-server replicas. Stateless — all state is in Postgres and the bucket — so this scales freely.
replicaCount: 2
