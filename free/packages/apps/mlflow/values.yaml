##
## @section Common parameters
##

## @param {string} [host] - Hostname for external access to the MLflow UI and tracking API via Ingress. Leave empty to keep it reachable only inside the cluster.
host: ""

## @param {string} [storageClass] - StorageClass for the managed Postgres PVCs. Leave empty to use the cluster default.
storageClass: ""

## @param {string} lakehouseRef - Name of the `Lakehouse` in this namespace whose bucket holds the run artifacts — models, plots, whatever a training run writes. Metadata lives in the private Postgres below; artifacts are large and belong in object storage.
lakehouseRef: ""

##
## @section Database
##

## @typedef {struct} Database - PostgreSQL holding run metadata: parameters, metrics, the model registry. A private dependency the user never addresses, but the one that holds the experiment history.
## @field {quantity} size - Persistent Volume size for metadata.
## @field {int} replicas - Number of database instances.
## @field {string} [password] - Optional explicit password. When empty, one is generated and preserved across reconciles.
## @param {Database} database - PostgreSQL configuration.
database:
  size: 10Gi
  replicas: 2
  password: ""

