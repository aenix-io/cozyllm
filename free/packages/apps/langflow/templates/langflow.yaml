{{- /*
  ComputePlane mode (computePlane: true): the bundled Postgres is a private
  dependency deployed as a raw CNPG Cluster on the MANAGEMENT cluster, hidden
  from the user. Only the untrusted Langflow workload is routed onto the
  tenant's ComputePlane; it reaches the management Postgres by DNS
  (postgres-<rel>-db-rw resolves via the ComputePlane pods' *.svc search
  domain). The DB password and the Langflow secret key are generated once here
  (lookup existing -> reuse, else randAlphaNum) so they survive restarts, and
  passed into the workload as values — the workload pod cannot read a
  management Secret, so a plain secretKeyRef would break cross-cluster.
*/}}
{{- $db := printf "postgres-%s-db" .Release.Name }}
{{- $secret := printf "%s-app" $db }}
{{- $pw := "" }}
{{- $secretKey := "" }}
{{- if .Values.computePlane }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{ $data = $existing.data }}{{ end }}
{{- $pw = .Values.database.password }}
{{- if not $pw }}
  {{- if hasKey $data "password" }}{{ $pw = index $data "password" | b64dec }}{{ else }}{{ $pw = randAlphaNum 24 }}{{ end }}
{{- end }}
{{- if hasKey $data "secret-key" }}{{ $secretKey = index $data "secret-key" | b64dec }}{{ else }}{{ $secretKey = randAlphaNum 32 }}{{ end }}
---
# Bundled Postgres credentials (management). Generated by the chart, hidden from the user.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ $pw | quote }}
  secret-key: {{ $secretKey | quote }}
---
# Bundled raw CNPG Postgres (management) — private dependency, not a first-class app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.database.replicas }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
  storage:
    size: {{ .Values.database.size }}
    {{- with .Values.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.user }}
      secret:
        name: {{ $secret }}
  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
{{- end }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # cozystack already creates an outer HelmRelease named `{{ .Release.Name }}` from
  # the ApplicationDefinition; the wrapping HelmRelease we render here must have a
  # different name to avoid the "patch a resource with different ownership" failure.
  name: {{ .Release.Name }}-app
spec:
  interval: 5m
  {{- if .Values.computePlane }}
  kubeConfig:
    secretRef:
      name: computeplane-cluster-admin-kubeconfig
      key: super-admin.svc
  # The tenant namespace does not exist on the ComputePlane; create it there and
  # store the Helm release in it (createNamespace alone is a no-op without an
  # explicit targetNamespace on the remote cluster).
  targetNamespace: {{ .Release.Namespace }}
  storageNamespace: {{ .Release.Namespace }}
  install:
    createNamespace: true
  {{- end }}
  chart:
    spec:
      chart: langflow-ide
      # renovate: datasource=helm depName=langflow-ide registryUrl=https://langflow-ai.github.io/langflow-helm-charts/
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: langflow
        namespace: external-langflow
  {{- if not .Values.computePlane }}
  dependsOn:
    - name: postgres-{{ .Release.Name }}-db
      namespace: {{ .Release.Namespace }}
  {{- end }}
  values:
    # Bundled postgresql subchart is replaced with the cozystack-managed Postgres
    # provisioned via the Pattern C sibling CR in templates/postgres.yaml.
    postgresql:
      enabled: false
    langflow:
      # Pin the Langflow image: the upstream langflow-ide chart defaults every
      # image tag to the floating "latest", so without this override the
      # deployed Langflow version drifts on every pod restart. Keep this in
      # sync with Chart.yaml appVersion.
      global:
        image:
          tag: {{ .Chart.AppVersion | quote }}
      # global.image.tag does not cascade to the frontend image, so pin it too.
      frontend:
        image:
          tag: {{ .Chart.AppVersion | quote }}
      backend:
        image:
          tag: {{ .Chart.AppVersion | quote }}
        {{- if .Values.computePlane }}
        # Stable key so stored-credential encryption survives pod restarts.
        secretKey: {{ $secretKey | quote }}
        {{- end }}
        {{- if and .Values.resources (or .Values.resources.cpu .Values.resources.memory) }}
        resources:
          requests:
            {{- with .Values.resources.cpu }}
            cpu: {{ . | quote }}
            {{- end }}
            {{- with .Values.resources.memory }}
            memory: {{ . | quote }}
            {{- end }}
          limits:
            {{- with .Values.resources.cpu }}
            cpu: {{ . | quote }}
            {{- end }}
            {{- with .Values.resources.memory }}
            memory: {{ . | quote }}
            {{- end }}
        {{- end }}
        externalDatabase:
          enabled: true
          driver:
            value: "postgresql"
          host:
            value: "postgres-{{ .Release.Name }}-db-rw"
          port:
            value: "5432"
          user:
            value: "{{ .Values.database.user }}"
          {{- if .Values.computePlane }}
          # Same generated password as the management Postgres, passed as a value
          # (the workload pod on the ComputePlane cannot read a management Secret).
          password:
            value: {{ $pw | quote }}
          {{- else }}
          password:
            valueFrom:
              secretKeyRef:
                name: "postgres-{{ .Release.Name }}-db-credentials"
                key: "{{ .Values.database.user }}"
          {{- end }}
          database:
            value: "{{ .Values.database.name }}"
    # Exposure (Ingress) is handled by the OIDC gatekeeper (templates/
    # gatekeeper.yaml), never by the upstream chart — so Langflow (which
    # defaults to AUTO_LOGIN) is never reachable from outside the cluster
    # without authenticating through Keycloak.
    ingress:
      enabled: false
