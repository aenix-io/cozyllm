##
## @section Common parameters
##

## @param {string} [host] - Hostname for the Airflow UI on the ComputePlane's ingress. Leave empty to keep it reachable only inside the cluster.
host: ""

## @param {string} [storageClass] - StorageClass for the metadata database on the management cluster. Leave empty to use the cluster default.
storageClass: ""

##
## @section DAGs
##

## @typedef {struct} Dags - Where DAG files come from. Airflow only runs what it can import, so with no repository configured you get a working scheduler with nothing to schedule.
## @field {string} [repo] - Git repository to sync DAGs from. Leave empty to configure DAG delivery yourself.
## @field {string} branch - Branch to track.
## @field {string} [subPath] - Path within the repository holding the DAG files. Empty means the repository root.
## @field {string} syncPeriod - How often to poll the repository for changes.
## @field {string} [sshSecret] - Name of a Secret holding an SSH key for a private repository. It must already exist on the ComputePlane.
## @param {Dags} dags - DAG source.
dags:
  repo: ""
  branch: "main"
  subPath: ""
  syncPeriod: "60s"
  sshSecret: ""

##
## @section Logs
##

## @typedef {struct} Logs - Task logs. A task runs in its own pod which exits when the task ends, so without a shared volume the UI cannot show the log of a finished task. Requires a ReadWriteMany storage class on the ComputePlane.
## @field {bool} persistence - Keep task logs on a shared volume.
## @field {quantity} size - Volume size for logs.
## @field {string} [storageClass] - StorageClass for the log volume on the ComputePlane. Must support ReadWriteMany.
## @param {Logs} logs - Task log retention.
logs:
  persistence: true
  size: 20Gi
  storageClass: ""

##
## @section Database
##

## @typedef {struct} Database - Airflow's metadata database, holding DAG state, run history and connections. It is a private dependency provisioned on the management cluster, not a Postgres app you address directly.
## @field {quantity} size - Persistent Volume size.
## @field {int} replicas - Number of database instances.
## @field {string} [password] - Explicit password. When empty, one is generated and preserved across reconciles.
## @param {Database} database - Metadata database.
database:
  size: 10Gi
  replicas: 2
  password: ""

