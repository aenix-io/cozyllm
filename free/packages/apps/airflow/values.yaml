## @typedef {struct} Resources - Explicit CPU and memory. Leave empty to take the values from the preset.
## @field {quantity} [cpu] - CPU available to the pod.
## @field {quantity} [memory] - Memory available to the pod.
## @field {quantity} [ephemeral-storage] - Ephemeral storage for the pod.

## @typedef {struct} Scheduler - Parses DAG files, decides what is due and launches a pod per task. DAG parsing is the CPU-hungry part, and it scales with how many DAG files you have rather than how much data they move.
## @field {int} replicas - Number of scheduler replicas.
## @field {ResourcesPreset} resourcesPreset - Sizing preset.
## @field {Resources} [resources] - Explicit resources, overriding the preset.
## @param {Scheduler} scheduler - Scheduler.
scheduler:
  replicas: 1
  resourcesPreset: "c1.medium"
  resources: {}

## @typedef {struct} ApiServer - Serves the UI and the REST API. It reads state rather than producing it, so it stays small.
## @field {int} replicas - Number of API server replicas.
## @field {ResourcesPreset} resourcesPreset - Sizing preset.
## @field {Resources} [resources] - Explicit resources, overriding the preset.
## @param {ApiServer} apiServer - UI and REST API.
apiServer:
  replicas: 2
  resourcesPreset: "t1.medium"
  resources: {}

## @typedef {struct} Triggerer - Holds deferrable tasks that are waiting on something external. One process parks thousands of waiting tasks without keeping a pod alive for each, so a sensor costs almost nothing.
## @field {ResourcesPreset} resourcesPreset - Sizing preset.
## @field {Resources} [resources] - Explicit resources, overriding the preset.
## @param {Triggerer} triggerer - Deferrable task handler.
triggerer:
  resourcesPreset: "t1.medium"
  resources: {}

## @typedef {struct} Workers - The budget a single task pod gets. With KubernetesExecutor this is not a standing pool: one pod is created per task and removed when it finishes, so this sizes the task rather than the cluster.
## @field {ResourcesPreset} resourcesPreset - Sizing preset.
## @field {Resources} [resources] - Explicit resources, overriding the preset.
## @param {Workers} workers - Per-task pod sizing.
workers:
  resourcesPreset: "u1.medium"
  resources: {}
