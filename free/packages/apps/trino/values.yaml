##
## @section Common parameters
##

## @param {string} [host] - Hostname for external access to the Trino UI and JDBC endpoint via Ingress. Leave empty to keep it reachable only inside the cluster.
host: ""

## @param {string} lakehouseRef - Name of the `Lakehouse` in this namespace whose catalog and bucket this engine reads. This is a reference rather than a private dependency on purpose: the tables outlive the engine, and several engines are expected to see the same ones.
lakehouseRef: ""

