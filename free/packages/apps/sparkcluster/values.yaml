## @typedef {struct} Resources - Explicit CPU and memory. Leave empty to take the values from the preset.
## @field {quantity} [cpu] - CPU available to the pod.
## @field {quantity} [memory] - Memory available to the pod.
## @field {quantity} [ephemeral-storage] - Ephemeral storage for the pod.

## @typedef {struct} Controller - The Spark Operator itself, which turns a submitted SparkApplication into a driver and its executors. It schedules work rather than doing it, so it stays small — the size of your jobs is set per job, not here.
## @field {int} replicas - Number of operator replicas.
## @field {ResourcesPreset} resourcesPreset - Sizing preset for the operator.
## @field {Resources} [resources] - Explicit resources, overriding the preset.
## @param {Controller} controller - Spark Operator deployment.
controller:
  replicas: 1
  resourcesPreset: "t1.medium"
  resources: {}
