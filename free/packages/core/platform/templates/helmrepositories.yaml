# No external HelmRepositories required.
# vllm-inference chart is sourced directly from the cozyllm GitRepository.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jupyterhub
  namespace: external-jupyterhub
spec:
  interval: 5m
  url: https://jupyterhub.github.io/helm-chart/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langflow
  namespace: external-langflow
spec:
  interval: 5m
  url: https://langflow-ai.github.io/langflow-helm-charts/
---
# oauth2-proxy — OIDC gatekeeper deployed in front of the ComputePlane workload
# of every gated app (jupyterhub / langflow / comfyui) when computePlane is
# enabled; unused (the gatekeeper is a bundled Deployment) otherwise.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oauth2-proxy
  namespace: external-oauth2-proxy
spec:
  interval: 5m
  url: https://oauth2-proxy.github.io/manifests
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nessie
  namespace: external-nessie
spec:
  interval: 5m
  url: https://charts.projectnessie.org
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: trino
  namespace: external-trino
spec:
  interval: 5m
  url: https://trinodb.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spark-operator
  namespace: external-spark-operator
spec:
  interval: 5m
  url: https://kubeflow.github.io/spark-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: airflow
  namespace: external-airflow
spec:
  interval: 5m
  url: https://airflow.apache.org
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coder
  namespace: external-coder
spec:
  interval: 5m
  url: https://helm.coder.com/v2
