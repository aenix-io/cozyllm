apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: litellm
spec:
  application:
    kind: Litellm
    plural: litellms
    singular: litellm
    openAPISchema: |
      {
        "title": "Chart Values",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "type": "object",
        "required": ["masterKey"],
        "properties": {
          "masterKey": {
            "type": "string",
            "title": "Master API Key",
            "description": "Admin key. All clients use this or virtual keys derived from it.",
            "x-cozy-widget": "password",
            "x-cozy-sensitive": true
          },
          "models": {
            "type": "array",
            "title": "LLM Backends",
            "description": "vLLM instances to proxy. URL pattern: http://<release>.<namespace>.svc.cluster.local:8000",
            "default": [],
            "items": {
              "type": "object",
              "required": ["name", "url"],
              "properties": {
                "name": {"type": "string", "title": "Model name"},
                "url":  {"type": "string", "title": "vLLM service URL"},
                "apiKey": {"type": "string", "title": "API Key (optional)"}
              }
            }
          },
          "postgres": {
            "type": "object",
            "title": "PostgreSQL",
            "properties": {
              "enabled":      {"type": "boolean", "title": "Enable managed Postgres", "default": true},
              "replicas":     {"type": "integer", "title": "Replicas", "default": 1, "minimum": 1, "maximum": 3},
              "size":         {"type": "string",  "title": "PVC size", "default": "5Gi", "pattern": "^[0-9]+(Mi|Gi|Ti)$"},
              "user":         {"type": "string",  "title": "DB user", "default": "litellm"},
              "name":         {"type": "string",  "title": "DB name", "default": "litellm"},
              "storageClass": {"type": "string",  "title": "Storage class", "description": "Leave empty to use cluster default."}
            }
          },
          "host": {
            "type": "string",
            "title": "Hostname",
            "description": "Expose via Ingress. Leave empty for cluster-internal only.",
            "pattern": "^$|^[a-z0-9][a-z0-9\\-\\.]+[a-z0-9]$"
          },
          "replicaCount": {
            "type": "integer",
            "title": "Replicas",
            "default": 1,
            "minimum": 1,
            "maximum": 5
          }
        }
      }
  release:
    chartRef:
      kind: HelmChart
      name: cozyllm-litellm
      namespace: cozy-public
    labels:
      cozystack.io/ui: "true"
    prefix: litellm-
  dashboard:
    category: PaaS
    singular: "LLM Gateway"
    plural: "LLM Gateways"
    description: "Managed LiteLLM gateway service"
    tags:
      - ai
      - llm
      - gateway
      - litellm
    icon: 
    keysOrder:
      - - apiVersion
      - - kind
      - - metadata
      - - metadata
        - name
      - - spec
        - masterKey
      - - spec
        - models
      - - spec
        - postgres
      - - spec
        - host
      - - spec
        - replicaCount
