apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: lakehouse
spec:
  application:
    kind: Lakehouse
    plural: lakehouses
    singular: lakehouse
    openAPISchema: |
      {"title":"Chart Values","type":"object","properties":{"catalog":{"description":"Catalog implementation. Hive Metastore is deliberately absent: it has no maintained upstream Helm chart, so supporting it means owning a Deployment, and that is deferred until a consumer needs the Hive protocol.","type":"string","default":"Nessie","enum":["Nessie"]},"database":{"description":"PostgreSQL configuration for the catalog.","type":"object","default":{},"required":["replicas","size"],"properties":{"password":{"description":"Optional explicit password. When empty, one is generated and preserved across reconciles.","type":"string","default":""},"replicas":{"description":"Number of database instances.","type":"integer","default":2},"size":{"description":"Persistent Volume size for catalog metadata.","default":"20Gi","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}},"host":{"description":"Hostname for external access to the catalog API via Ingress. Leave empty to keep the catalog reachable only inside the cluster, which is the usual choice: engines connect over cluster DNS and nothing outside needs to speak the catalog protocol.","type":"string","default":""},"maintenance":{"description":"Unreferenced-file garbage collection.","type":"object","default":{},"required":["enabled","retainSnapshotDays","schedule"],"properties":{"enabled":{"description":"Run the GC CronJob. Off by default: the invocation has not been validated against a running catalog, and a job that deletes data files is the wrong place to guess.","type":"boolean","default":false},"retainSnapshotDays":{"description":"Age below which content stays live. Data files unreferenced for longer become collectable, and time travel further back than this stops working.","type":"integer","default":7},"schedule":{"description":"Cron schedule for the GC run.","ty