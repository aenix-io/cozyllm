apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
      annotations:
        # Force redeploy when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z postgres-{{ include "litellm.postgresName" . }}-rw 5432; do
                echo "waiting for postgres..."; sleep 3
              done
      {{- end }}
      containers:
        - name: litellm
          image: "ghcr.io/berriai/litellm-database:v{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--detailed_debug"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm.fullname" . }}-master-key
                  key: key
            {{- if .Values.postgres.enabled }}
            # Canonical Pattern C wiring: the `postgres-<name>-credentials`
            # Secret keys passwords by username (see cozystack/packages/system/
            # postgres-rd/cozyrds/postgres.yaml). The DATABASE_URL is composed
            # via Kubernetes env-var expansion ($(VAR)) — these vars must
            # appear above DATABASE_URL in the list. cozystack-generated
            # passwords are alphanumeric (randAlphaNum 32), so URL-encoding
            # is not required.
            - name: DATABASE_USER
              value: {{ .Values.postgres.user | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ include "litellm.postgresName" . }}-credentials
                  key: {{ .Values.postgres.user }}
            - name: DATABASE_HOST
              value: "postgres-{{ include "litellm.postgresName" . }}-rw"
            - name: DATABASE_NAME
              value: {{ .Values.postgres.name | quote }}
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)"
            {{- end }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "litellm.fullname" . }}-config
