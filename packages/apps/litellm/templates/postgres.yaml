{{- if .Values.postgres.enabled }}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata:
  name: {{ include "litellm.postgresName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  size: {{ .Values.postgres.size }}
  replicas: {{ .Values.postgres.replicas }}
  external: false
  {{- with .Values.postgres.storageClass }}
  storageClass: {{ . }}
  {{- end }}
  users:
    {{ .Values.postgres.user }}: {}
  databases:
    {{ .Values.postgres.name }}:
      roles:
        admin:
          - {{ .Values.postgres.user }}
{{- end }}
